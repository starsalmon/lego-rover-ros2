/**:
  ros__parameters:
    # DualShock 4 (Wireless Controller) on Linux / hid-playstation
    axis_linear: 1          # left stick up/down
    axis_angular: 0         # left stick left/right
    scale_linear: 0.45
    scale_linear_turbo: 0.7
    scale_angular: 1.0
    scale_angular_turbo: 1.5
    enable_button: 4        # L1 (hold to drive — reliable on PS4 BT)
    enable_turbo_button: 5  # R1
    require_enable_button: true
    invert_linear: true     # Linux joy often reports stick up as negative
    invert_angular: false
    deadzone: 0.15
