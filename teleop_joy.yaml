/**:
  ros__parameters:
    # Xbox / PS4 / Switch Pro — tweak if sticks feel wrong
    axis_linear: 1          # left stick vertical
    axis_angular: 0         # left stick horizontal
    scale_linear: 0.45
    scale_linear_turbo: 0.7
    scale_angular: 1.2
    scale_angular_turbo: 1.8
    enable_button: 6        # usually L2 / left bumper area
    enable_turbo_button: 7
    require_enable_button: true
    invert_linear: false
    invert_angular: false
    deadzone: 0.12
